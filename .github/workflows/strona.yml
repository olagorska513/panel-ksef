name: Publikacja strony

on:
  push:
    branches: [main]
    paths: ['strona/**', '.github/workflows/strona.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona

  opublikuj:
    needs: zbuduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - id: publikacja
        uses: actions/deploy-pages@v4
