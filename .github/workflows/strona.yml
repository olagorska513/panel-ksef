name: Aktualizacja strony

on:
  schedule:
    # Godziny w UTC: 7:00, 12:00 i 16:00 czasu polskiego zimowego (latem o godzinę później).
    # GitHub może uruchomić zadanie z kilkunastominutowym opóźnieniem.
    - cron: '0 6,11,15 * * *'
  push:
    branches: [main]
  workflow_dispatch: # przycisk "Run workflow" = sprawdź teraz

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  zbuduj:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Pobierz i zaszyfruj komunikaty KSeF
        run: node narzedzia/pobierz-komunikaty.mjs
        env:
          KLUCZ_DANYCH: ${{ secrets.KLUCZ_DANYCH }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: strona

  opublikuj:
    needs: zbuduj
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.publikacja.outputs.page_url }}
    steps:
      - id: publikacja
        uses: actions/deploy-pages@v4
